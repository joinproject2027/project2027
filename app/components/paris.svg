<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 740" role="img" aria-labelledby="paris-title paris-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="paris-title">A little rat above Paris</title>
  <desc id="paris-desc">Minimal cream line art on a midnight blue sky. A rat sits on a Parisian rooftop, gazing toward the Eiffel Tower beneath a crescent moon and stars.</desc>
