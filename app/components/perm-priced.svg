<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-label="Two rows, each with a user working in a tool on the left and the people who change the tool on the right. Closed: the user's pain, a rich jagged red signal, hits a wall with a narrow slot marked with a dollar sign, and only a single dot gets through. Open: the boundary is permeable, the whole signal crosses to the tool's makers, and the user can cross too, becoming a contributor." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
